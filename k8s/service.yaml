apiVersion: v1
kind: Service
metadata:
  name: punitxd-sample-nodejs
  namespace: kairo-punitxd-sample-nodejs
  labels:
    app: punitxd-sample-nodejs
    app.kubernetes.io/managed-by: kairo
spec:
  # cluster-internal only: all outside traffic comes in through Traefik's
  # Ingress, so request metrics are always counted
  type: ClusterIP
  selector:
    app: punitxd-sample-nodejs
  ports:
    - name: http
      port: 80
      targetPort: 3000
