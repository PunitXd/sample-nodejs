apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punitxd-sample-nodejs
  namespace: kairo-punitxd-sample-nodejs
  labels:
    app: punitxd-sample-nodejs
    app.kubernetes.io/managed-by: kairo
spec:
  # Traefik is the only way in. It answers on localhost:80, and the app's
  # public link (a Cloudflare tunnel) points at it with this Host header
  ingressClassName: traefik
  rules:
    - host: punitxd-sample-nodejs.kairo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: punitxd-sample-nodejs
                port:
                  number: 80
